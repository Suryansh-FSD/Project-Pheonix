[project]
name = "geosr-backend"
version = "1.0.0"
description = "GeoSR FastAPI Backend & SEN2SRLite Inference Service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "sen2sr>=0.0.1",
    "mlstac>=0.1.0",
    "rasterio>=1.3.9",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "pillow>=10.2.0",
    "opencv-python-headless>=4.9.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.1.0",
    "httpx>=0.27.0",
    "modal>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
